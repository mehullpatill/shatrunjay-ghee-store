name: Reset admin password

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to update only the admin password'
        required: true
        type: string
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: shatrunjay-admin-password-reset
  cancel-in-progress: false

jobs:
  reset-admin-password:
    if: ${{ inputs.confirm == 'RESET' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is missing"; exit 1; }
          test -n "$ADMIN_SEED_PASSWORD" || { echo "ADMIN_SEED_PASSWORD secret is missing"; exit 1; }
          test "${#ADMIN_SEED_PASSWORD}" -ge 12 || { echo "ADMIN_SEED_PASSWORD must be at least 12 characters"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Update admin password only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
        run: npx tsx scripts/reset-admin-password.ts
